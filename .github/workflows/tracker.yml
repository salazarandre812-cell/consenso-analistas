name: Consenso de analistas

on:
  schedule:
    # 07:00 UTC de segunda a sexta. Ajusta a gosto — os ratings da Finnhub
    # vêm agregados por mês, portanto uma vez por dia já é generoso.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:        # botão para correr manualmente

permissions:
  contents: write           # necessário para o job commitar o resultado

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr o tracker
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python tracker.py

      - name: Guardar o resultado
        run: |
          git config user.name  "tracker"
          git config user.email "tracker@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Consenso $(date -u +%Y-%m-%d)"
            git push
          fi
